name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  bundle:
    name: Bundle check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache amxx-builder cache dir (compiler)
        uses: actions/cache@v4
        with:
          path: ~/.cache/amxx-builder
          key: amxb-cache-${{ runner.os }}-${{ hashFiles('src/compiler-fetcher.js') }}

      - name: Install dependencies
        run: npm ci

      - name: Build dist (esbuild)
        run: npm run bundle

      - name: Smoke-test dist/index.js
        run: node scripts/smoke-test.js
