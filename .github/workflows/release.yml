name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  release:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
      id-token: write   # Required for OIDC (trusted publishing)

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Base the release commit on the current master tip
        # Keeps the push to master a fast-forward even if master moved
        # after the tag was created, and makes re-runs no-ops (deterministic
        # rebuild => empty diff => nothing to commit).
        run: |
          git fetch origin master
          git checkout --detach origin/master

      - name: Align package.json with the tag
        # --allow-same-version: re-runs already have this version, don't fail
        run: |
          VERSION="${{ github.ref_name }}"
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version

      - name: Build dist and commit
        id: build-dist
        uses: ./.github/actions/build-dist
        with:
          message: 'chore: build dist for ${{ github.ref_name }}'
          extra-files: 'package.json package-lock.json'

      - name: Update floating tags
        run: |
          VERSION="${{ github.ref_name }}"
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          if [ "${{ steps.build-dist.outputs.changed }}" = "true" ]; then
            # Point the exact and floating tags at this release commit
            git tag -fa "$VERSION" -m "Release $VERSION"
            git tag -fa "$MINOR"   -m "Update $MINOR"
            git tag -fa "$MAJOR"   -m "Update $MAJOR"
            git push origin "$VERSION" "$MINOR" "$MAJOR" --force
          else
            echo "No changes - release $VERSION already published"

            # Repair tags if a previous run died before moving them: point them
            # at the existing release commit (the one that built this version).
            RELEASE_COMMIT=$(git log --format=%H -1 --grep="chore: build dist for $VERSION" origin/master || true)
            if [ -n "$RELEASE_COMMIT" ]; then
              git tag -fa "$VERSION" -m "Release $VERSION" "$RELEASE_COMMIT"
              git tag -fa "$MINOR"   -m "Update $MINOR" "$RELEASE_COMMIT"
              git tag -fa "$MAJOR"   -m "Update $MAJOR" "$RELEASE_COMMIT"
              git push origin "$VERSION" "$MINOR" "$MAJOR" --force
            fi
          fi

      - name: Publish to npm
        # Trusted publishing (OIDC): npm CLI exchanges a short-lived token from
        # the runner automatically; no NODE_AUTH_TOKEN needed.
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} already published, skipping"
          else
            npm publish
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
