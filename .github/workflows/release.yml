name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  release:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run bundle

      - name: Commit dist and update tags
        run: |
          VERSION="${{ github.ref_name }}"
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Base the release commit on the current master tip, not the tag.
          # This keeps the push to master a fast-forward even if master moved
          # after the tag was created, and makes re-runs no-ops (deterministic
          # rebuild => empty diff => nothing to commit).
          git fetch origin master
          git checkout --detach origin/master

          # Align package.json with the tag and rebuild the bundled action
          # (--allow-same-version: re-runs already have this version, don't fail)
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npm run bundle

          git add package.json package-lock.json
          git add -f dist/

          if git diff --cached --quiet; then
            echo "No changes - release $VERSION already published"

            # Repair tags if a previous run died before moving them: point them
            # at the existing release commit (the one that built this version).
            RELEASE_COMMIT=$(git log --format=%H -1 --grep="chore: build dist for $VERSION" origin/master || true)
            if [ -n "$RELEASE_COMMIT" ]; then
              git tag -fa "$VERSION" -m "Release $VERSION" "$RELEASE_COMMIT"
              git tag -fa "$MINOR"   -m "Update $MINOR" "$RELEASE_COMMIT"
              git tag -fa "$MAJOR"   -m "Update $MAJOR" "$RELEASE_COMMIT"
              git push origin "$VERSION" "$MINOR" "$MAJOR" --force
            fi
          else
            git commit -m "chore: build dist for $VERSION"

            # Absorb anything that landed on master while we were building
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:refs/heads/master

            # Point the exact and floating tags at this release commit
            git tag -fa "$VERSION" -m "Release $VERSION"
            git tag -fa "$MINOR"   -m "Update $MINOR"
            git tag -fa "$MAJOR"   -m "Update $MAJOR"
            git push origin "$VERSION" "$MINOR" "$MAJOR" --force
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} already published, skipping"
          else
            npm publish
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
