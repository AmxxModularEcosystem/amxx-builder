name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  release:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run bundle

      - name: Commit dist and update tags
        run: |
          VERSION="${{ github.ref_name }}"
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          npm version "${VERSION#v}" --no-git-tag-version
          git add package.json package-lock.json
          git add -f dist/
          if git diff --cached --quiet; then
            echo "nothing changed, skipping commit"
          else
            git commit -m "chore: build dist for $VERSION"
            git push origin HEAD:refs/heads/master
          fi

          # Move exact tag to dist-included commit
          git tag -fa "$VERSION" -m "Release $VERSION"

          # Update floating minor and major tags
          git tag -fa "$MINOR"   -m "Update $MINOR"
          git tag -fa "$MAJOR"   -m "Update $MAJOR"

          git push origin "$VERSION" "$MINOR" "$MAJOR" --force

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
