# Локальная сборка — эквивалент build.bat
# Запускается из папки плагина: amxb build --manifest amxbuild.local.yml
# Компилирует amxmodx/scripting/*.sma и пакует всё в {name}.zip
# Структура архива: /{name}/addons/amxmodx/ + /{name}/ (assets) + README.md
#
# Дефолты уже обеспечивают:
#   archive_name: "{name}.zip"
#   amxmodx_path: "{name}/addons/amxmodx"
#   assets_path:  "{name}"
#   readme: true
#
# INI плагинов не генерируется, пока нигде не задано значение ini.

name: ExampleLocal

amxmodx:
  version: "1.10.5428"   # опционально; без указания берётся последняя версия
  # exclude_files:       # glob-паттерны от amxmodx.dir: не копировать файлы в пакет
  #   - configs/*.cfg

deps:
  - AmxxModularEcosystem/ParamsController@1.4.0

# Единая настройка INI: defaults — базовый слой для всех плагинов,
# rules — glob-правила только для локальных amxmodx/scripting/*.sma.
# ini: false — не включать в INI; true/"" — plugins.ini; "<postfix>" — plugins-<postfix>.ini
plugins:
  defaults:
    ini: local           # → plugins-local.ini
    debug: false
  rules:
    - match: "utils/*.sma"
      ini: false         # компилировать, но не включать ни в один INI
    - match: "*Test*.sma"
      enabled: false     # полностью пропустить
    - match: "VipM/*.sma"
      ini: vipm          # → plugins-vipm.ini
      debug: true        # vip_core.amxx debug
